            x = (x ^ (x >>> 16)) >>> 0;
            x = Math.imul(x, 0x7FEB352D) >>> 0;
            x = (x ^ (x >>> 15)) >>> 0;
            x = Math.imul(x, 0x846CA68B) >>> 0;
            x = (x ^ (x >>> 16)) >>> 0;
            return x;
        }
        // FunnelTable: a minimal JS port of the WGSL funnel schedule
        // (Farach-Colton, Krapivin, & Kuszmaul, 2025, Section 3) used for the adaptive
        // occupied-node directory. The WGSL port in the adaptive shader is the
        // AUTHORITATIVE one; this JS class exists only to BUILD the table on
        // CPU during adaptiveMetadata construction. Layout math mirrors
        // computeFunnelGeometry exactly (same alpha/beta/overflow/salts), and
        // insert/probe mirror the WGSL funnel_build/funnelProbe descent so the
        // GPU probe finds every key JS inserted.
        //
        // Stores (key -> value) in two parallel u32 arrays (keys + values);
        // EH_EMPTY (0xFFFFFFFF) marks an empty key slot. insert returns the
        // claimed slot or -1 if the table is full (should not happen at load
        // <= 1 - delta). probe returns the value for key, or -1 if absent.
        const FUNNEL_EMPTY = 0xFFFFFFFF;
        class FunnelTable {
            constructor(capacity, delta) {
                this.geom = computeFunnelGeometry(capacity, delta);
                const g = this.geom;
                this.keys = new Uint32Array(g.totalSize).fill(FUNNEL_EMPTY);
                this.values = new Uint32Array(g.totalSize);
            }
            // Claim a slot for key (serial insert; the WGSL build uses parallel
            // CAS but the schedule + probe bound are identical). Returns slot
            // or -1 if the table is full.
            insert(key, value) {
                const g = this.geom;
                const alpha = g.alpha, beta = g.beta;
                // Funnel region: one beta-slot sub-array per slab.
                for (let i = 0; i < alpha; i++) {
                    const aCount = g.subarrayCounts[i];
                    const base = g.slabOffsets[i] + (hashU32JS(key ^ g.slabSalts[i]) % aCount) * beta;
                    for (let s = 0; s < beta; s++) {
                        const pos = base + s;
                        if (this.keys[pos] === FUNNEL_EMPTY) {
                            this.keys[pos] = key; this.values[pos] = value; return pos;
                        }
                        if (this.keys[pos] === key) { this.values[pos] = value; return pos; }
                    }
                }
                // Overflow B: uniform probing, bAttempts slots.
                const bSize = g.bSize, bOff = g.bOffset, bAttempts = g.bAttempts;
                if (bSize > 0) {
                    for (let t = 0; t < bAttempts; t++) {
                        const pos = bOff + (hashU32JS(key ^ g.bSalts[t]) % bSize);
                        if (this.keys[pos] === FUNNEL_EMPTY) {
                            this.keys[pos] = key; this.values[pos] = value; return pos;
                        }
                        if (this.keys[pos] === key) { this.values[pos] = value; return pos; }
                    }
                }
                // Overflow C: two-choice buckets of cBucketSlots slots.
                const cOff = g.cOffset, cNumBuckets = g.cNumBuckets, cBucketSlots = g.cBucketSlots;
                if (cNumBuckets > 0) {
                    const b1 = hashU32JS(key ^ g.cSalt1) % cNumBuckets;
                    const b2 = hashU32JS(key ^ g.cSalt2) % cNumBuckets;
                    for (let t = 0; t < cBucketSlots; t++) {
                        const pa = cOff + b1 * cBucketSlots + t;
                        if (this.keys[pa] === FUNNEL_EMPTY) {
                            this.keys[pa] = key; this.values[pa] = value; return pa;
                        }
                        if (this.keys[pa] === key) { this.values[pa] = value; return pa; }
                        const pb = cOff + b2 * cBucketSlots + t;
                        if (this.keys[pb] === FUNNEL_EMPTY) {
                            this.keys[pb] = key; this.values[pb] = value; return pb;
                        }
                        if (this.keys[pb] === key) { this.values[pb] = value; return pb; }
                    }
                }
                return -1; // table full (should not happen at load <= 1 - delta)
            }
            // probe returns the value for key, or -1 if absent. Mirrors the
            // WGSL funnelProbe descent exactly.
            probe(key) {
                const g = this.geom;
                const alpha = g.alpha, beta = g.beta;
                for (let i = 0; i < alpha; i++) {
                    const aCount = g.subarrayCounts[i];
                    const base = g.slabOffsets[i] + (hashU32JS(key ^ g.slabSalts[i]) % aCount) * beta;
                    for (let s = 0; s < beta; s++) {
                        const pos = base + s;
                        const k = this.keys[pos];
                        if (k === key) { return this.values[pos]; }
                        if (k === FUNNEL_EMPTY) { return -1; }
                    }
                }
                const bSize = g.bSize, bOff = g.bOffset, bAttempts = g.bAttempts;
                if (bSize > 0) {
                    for (let t = 0; t < bAttempts; t++) {
                        const pos = bOff + (hashU32JS(key ^ g.bSalts[t]) % bSize);
                        const k = this.keys[pos];
                        if (k === key) { return this.values[pos]; }
                        if (k === FUNNEL_EMPTY) { return -1; }
                    }
                }
                const cOff = g.cOffset, cNumBuckets = g.cNumBuckets, cBucketSlots = g.cBucketSlots;
                if (cNumBuckets > 0) {
                    const b1 = hashU32JS(key ^ g.cSalt1) % cNumBuckets;
                    const b2 = hashU32JS(key ^ g.cSalt2) % cNumBuckets;
                    for (let t = 0; t < cBucketSlots; t++) {
                        const pa = cOff + b1 * cBucketSlots + t;
                        const ka = this.keys[pa];
                        if (ka === key) { return this.values[pa]; }
                        if (ka === FUNNEL_EMPTY) { return -1; }
                        const pb = cOff + b2 * cBucketSlots + t;
                        const kb = this.keys[pb];
                        if (kb === key) { return this.values[pb]; }
                        if (kb === FUNNEL_EMPTY) { return -1; }
                    }
                }
                return -1;
            }
        }

        function computeAdaptiveDepth(n, leafTarget) {
            const auto = Math.min(10, Math.max(4, Math.ceil(Math.log2(Math.sqrt(Math.max(1, n) / leafTarget)))));
            return adaptiveDepthOverride > 0 ? Math.min(10, Math.max(2, adaptiveDepthOverride)) : auto;
        }
        // Adaptive List-1 near-field TOTAL samples/particle auto tier.
        // MUST mirror the WGSL l2p totalBudget ladder exactly. Round 14:
        // full traversal (4096 cap) at N <= 32k, where validate.html
        // measures dv-rel-l2 parity with the fixed grid's exact 3x3 walk
        // (1.4% vs 1.1% at 32k); above that the drift-capped tree's leaves
        // grow fat, so mid-N runs the perf tier (48) with a documented
        // accuracy trade (~27% dv rel_l2 vs direct at the 8k-32k tree
        // shapes) and >2M drops to 32 (the sampleWeight cap then mutes the
        // near field at extreme scale). Override: ?p2pbudget= / sidebar
        // select.
        function p2pBudgetAutoForN(n) {
            if (n <= 32768) return 4096;
            return n > 2000000 ? 32 : 48;
        }
        // Leaf occupancy target scales with N so the per-24-frame JS rebuild
        // stays interactive at 5M particles (leaf count ~ N/leafTarget).
        function computeAdaptiveLeafTarget(n) {
            if (adaptiveLeafTargetOverride > 0) return adaptiveLeafTargetOverride;
            if (n > 2000000) return 64;
            if (n > 500000) return 32;
            return 16;
        }

        // Integer dyadic-cell adjacency: cells touch (boundary contact
        // counts) iff their closed intervals overlap inclusively on both
        // axes. Matches AdaptiveQuadTree._are_adjacent on dyadic cells.
        function cellsTouch(la, ax, ay, lb, bx, by) {
            // Normalize to the finer level.
            let ax0, ax1, ay0, ay1, bx0, bx1, by0, by1;
            if (la >= lb) {
                const s = 1 << (la - lb);
                ax0 = ax; ax1 = ax + 1; ay0 = ay; ay1 = ay + 1;
                bx0 = bx * s; bx1 = (bx + 1) * s; by0 = by * s; by1 = (by + 1) * s;
            } else {
                const s = 1 << (lb - la);
                ax0 = ax * s; ax1 = (ax + 1) * s; ay0 = ay * s; ay1 = (ay + 1) * s;
                bx0 = bx; bx1 = bx + 1; by0 = by; by1 = by + 1;
            }
            return ax0 <= bx1 && bx0 <= ax1 && ay0 <= by1 && by0 <= ay1;
        }

        // Per-(level, offset) M2L operator table for the materialized
        // far-field path (round 13). For a source at integer cell offset
        // (dx, dy) = (ax - sx, ay - sy) from its List-2 target at level l,
        // the M2L delta = target - source center is the fixed lattice vector
        // (dx, dy) * 2^-l, so the whole (p+1)^2 complex operator collapses
        // into a dense row indexed by (l, dx, dy) — the same precomputed-
        // matrix move as core/adaptive_fmm_fast.py's per-(level, offset)
        // M2L matrices (Gimbutas & Greengard, 2012, FMMLIB2D
        // itable(-3:3,-3:3); Carrier, Greengard, & Rokhlin, 1988).
        // Row layout: 25 complex = 50 f32, M[m][k] at row*50 + (m*5+k)*2,
        // row = l*49 + (dy+3)*7 + (dx+3), matching the CSR entry packing in
        // buildAdaptiveMetadata. Coefficients reproduce the WGSL m2l
        // kernel's inline math exactly (clog monopole log term, (-1)-signed
        // inverse powers, C(k+l-1, l) binomials), computed in f64, stored
        // f32. Position-independent: rebuilt per metadata build only so the
        // worker / Node emitter paths stay self-contained (sub-millisecond).
        function buildFarOperatorTable() {
            const table = new Float32Array(11 * 49 * 50);
            const binoms = [[1, 1, 1, 1, 1], [0, 1, 2, 3, 4],
                            [0, 1, 3, 6, 10], [0, 1, 4, 10, 20],
                            [0, 1, 5, 15, 35]]; // C(k+l-1, l); col k=0 unused
            for (let l = 0; l < 11; l++) {
                const w = Math.pow(2, -l);
                for (let oy = 0; oy < 7; oy++) {
                    for (let ox = 0; ox < 7; ox++) {
                        const dx = (ox - 3) * w, dy = (oy - 3) * w;
                        const row = l * 49 + oy * 7 + ox;
                        const put = (m, k, re, im) => {
                            const base = row * 50 + (m * 5 + k) * 2;
                            table[base] = re; table[base + 1] = im;
                        };
                        // clog(delta) = 0.5*ln|delta|^2 + i*atan2 (max-guard
                        // mirrors the WGSL clog; only the (0,0) row can hit it).
                        const r2 = Math.max(dx * dx + dy * dy, 1e-20);
                        const softR2 = r2 + 0.00004;
                        put(0, 0, 0.5 * Math.log(softR2), Math.atan2(dy, dx));
                        // Exact inverse powers for higher multipoles. The
                        // monopole local terms are filled from softened
                        // conjugate powers below so the table follows the
                        // same kernel as adaptive List-1/List-3.
                        const invP = [[1.0, 0.0]];
                        let pre = 1.0, pim = 0.0;
                        for (let n = 1; n <= 8; n++) {
                            const re = (pre * dx + pim * dy) / r2;
                            const im = (pim * dx - pre * dy) / r2;
                            invP.push([re, im]);
                            pre = re; pim = im;
                        }
                        const softInvP = [[1.0, 0.0]];
                        let spre = 1.0, spim = 0.0;
                        for (let n = 1; n <= 4; n++) {
                            const re = (spre * dx + spim * dy) / softR2;
                            const im = (spim * dx - spre * dy) / softR2;
                            softInvP.push([re, im]);
                            spre = re; spim = im;
                        }
                        for (let m = 0; m < 5; m++) {
                            for (let k = 0; k < 5; k++) {
                                if (m === 0 && k === 0) { continue; }
                                const inv = invP[m + k];
                                if (m === 0) {
                                    put(0, k, inv[0], inv[1]); // a_k / delta^k
                                } else if (k === 0) {
                                    const signA0 = (m & 1) === 1 ? 1.0 : -1.0;
                                    const softInv = softInvP[m];
                                    put(m, 0, softInv[0] * signA0 / m, softInv[1] * signA0 / m);
                                } else {
                                    const signAk = (m & 1) === 1 ? -1.0 : 1.0;
                                    const sc = signAk * binoms[m][k];
                                    put(m, k, inv[0] * sc, inv[1] * sc);
                                }
                            }
                        }
                    }
                }
            }
            return table;
        }

        // posStride: element stride between particles in `positions` (4 for
        // the live posVel layout x,y,vx,vy; 2 for the compacted x,y-only
        // snapshot the refresh worker transfers). Defaults to 4 so callers
        // passing the raw posVel view (and the Node meta emitter harness)
        // are unchanged.
        function buildAdaptiveMetadata(depth, positions, posStride = 4) {
            const pos = positions || initialPositions;
            const stride = posStride | 0 || 4;
            const D = Math.max(1, Math.min(10, depth | 0));
            const leafTarget = computeAdaptiveLeafTarget(N);
            const numLevels = D + 1;
            const leafSide = 1 << D;

            // ---- 1) Occupancy histogram at the deepest level -------------
            const cellCounts = new Uint32Array(leafSide * leafSide);
            for (let i = 0; i < N; i++) {
                const px = Math.min(0.999999, Math.max(0.0, pos[i * stride]));
                const py = Math.min(0.999999, Math.max(0.0, pos[i * stride + 1]));
                const ix = Math.min(leafSide - 1, (px * leafSide) | 0);
                const iy = Math.min(leafSide - 1, (py * leafSide) | 0);
                cellCounts[iy * leafSide + ix]++;
            }

            // ---- 2) Subtree-count pyramid + exists/split flags -----------
            // exists(l,cell) = l==0 or (parent exists && parent splits)
            // split(l,cell) = counts > leafTarget && l < D
            // A node's particles = its cell count (empty children skipped).
            const counts = new Array(numLevels);
            const exists = new Array(numLevels);
            counts[D] = cellCounts;
            exists[D] = new Uint8Array(leafSide * leafSide);
            for (let l = D - 1; l >= 0; l--) {
                const side = 1 << l;
                const cPrev = counts[l + 1];
                const c = new Uint32Array(side * side);
                for (let cy = 0; cy < side; cy++) {
                    for (let cx = 0; cx < side; cx++) {
                        const p = cy * side + cx;
                        const q = (2 * cy) * (2 * side) + 2 * cx;
                        c[p] = cPrev[q] + cPrev[q + 1] + cPrev[q + 2 * side] + cPrev[q + 2 * side + 1];
                    }
                }
                counts[l] = c;
                exists[l] = new Uint8Array(side * side);
            }
            const splitsAt = (l, cell) => counts[l][cell] > leafTarget && l < D;
            exists[0][0] = 1;
            for (let l = 1; l <= D; l++) {
                const side = 1 << l;
                const ex = exists[l], exPrev = exists[l - 1], cPrev = counts[l - 1];
                for (let cy = 0; cy < side; cy++) {
                    for (let cx = 0; cx < side; cx++) {
                        const p = cy * side + cx;
                        const pp = (cy >> 1) * (side >> 1) + (cx >> 1);
                        if (exPrev[pp] && splitsAt(l - 1, pp) && counts[l][p] > 0) ex[p] = 1;
                    }
                }
            }

            // ---- 3) Level-contiguous node numbering ----------------------
            const levelStart = new Uint32Array(numLevels);
            const levelCount = new Uint32Array(numLevels);
            const nodeOf = new Array(numLevels); // per-level cell -> nodeIdx+1
            let totalNodes = 0;
            for (let l = 0; l < numLevels; l++) {
                const side = 1 << l;
                const map = new Uint32Array(side * side);
                const ex = exists[l];
                levelStart[l] = totalNodes;
                let c = 0;
                for (let p = 0; p < side * side; p++) {
                    if (ex[p]) { map[p] = ++c; }
                }
                levelCount[l] = c;
                totalNodes += c;
                nodeOf[l] = map;
            }
            const nodeCount = totalNodes;

            // Node data arrays
            const INVALID = 0xFFFFFFFF;
            const nodeCenterSize = new Float32Array(nodeCount * 4); // cx, cy, width, depth
            // nodeMeta packs parent (.x) and terminal flag (.y) per node
            // into ONE vec2<u32> buffer — the same packing the standalone
            // core/webgpu_kernels/adaptive_fmm.wgsl uses to stay under the
            // 16-storage-buffer per-stage limit (the materialized far-field
            // CSR + operator table below take the slot separate arrays
            // would cost). nodeParent stays a builder-internal mirror for
            // the ancestor walks.
            const nodeMeta = new Uint32Array(nodeCount * 2);
            const nodeParent = new Uint32Array(nodeCount);
            const nodeChildren = new Uint32Array(nodeCount * 4);
            const nodeCell = new Uint32Array(nodeCount * 2);        // ix, iy at node level (list walks)
            const nodeParticleRange = new Uint32Array(nodeCount * 2); // offset, count
            const nodeIsLeaf = new Uint8Array(nodeCount);
            const leafIds = [];

            nodeParent.fill(INVALID);
            nodeChildren.fill(INVALID);

            for (let l = 0; l < numLevels; l++) {
                const side = 1 << l;
                const cellSize = 1.0 / side;
                const map = nodeOf[l];
                for (let iy = 0; iy < side; iy++) {
                    for (let ix = 0; ix < side; ix++) {
                        const cell = iy * side + ix;
                        const nm = map[cell];
                        if (!nm) continue;
                        const idx = levelStart[l] + nm - 1;
                        nodeCenterSize[idx * 4] = (ix + 0.5) * cellSize;
                        nodeCenterSize[idx * 4 + 1] = (iy + 0.5) * cellSize;
                        nodeCenterSize[idx * 4 + 2] = cellSize;
                        nodeCenterSize[idx * 4 + 3] = l;
                        nodeCell[idx * 2] = ix;
                        nodeCell[idx * 2 + 1] = iy;
                        if (l > 0) {
                            const pix = ix >> 1, piy = iy >> 1;
                            const parentIdx = levelStart[l - 1] + nodeOf[l - 1][piy * (side >> 1) + pix] - 1;
                            nodeParent[idx] = parentIdx;
                            const childSlot = ((iy & 1) << 1) | (ix & 1);
                            nodeChildren[parentIdx * 4 + childSlot] = idx;
                        }
                        if (!splitsAt(l, cell)) {
                            nodeMeta[idx * 2 + 1] = 1; // terminal
                            nodeIsLeaf[idx] = 1;
                            leafIds.push(idx);
                        }
                    }
                }
            }

            // Parent column of nodeMeta derives from the INVALID-filled
            // nodeParent mirror so the ROOT carries INVALID (parent 0 would
            // alias node 0 and fail the structural check).
            for (let i = 0; i < nodeCount; i++) { nodeMeta[i * 2] = nodeParent[i]; }

            // ---- 4) Particle assignment + counting sort by leaf ---------
            // leafForCell: level-D cell -> leaf node index (top-down fill).
            const leafForCell = new Uint32Array(leafSide * leafSide).fill(INVALID);
            {
                const stackL = [0], stackX = [0], stackY = [0];
                while (stackL.length) {
                    const l = stackL.pop(), cx = stackX.pop(), cy = stackY.pop();
                    const idx = levelStart[l] + nodeOf[l][cy * (1 << l) + cx] - 1;
                    if (nodeIsLeaf[idx]) {
                        // Fill every deepest-level cell under this leaf.
                        const s = 1 << (D - l);
                        const x0 = cx * s, y0 = cy * s;
                        for (let fy = 0; fy < s; fy++) {
                            const row = (y0 + fy) * leafSide;
                            leafForCell.fill(idx, row + x0, row + x0 + s);
                        }
                    } else {
                        for (let dy = 0; dy < 2; dy++) {
                            for (let dx = 0; dx < 2; dx++) {
                                const nx = 2 * cx + dx, ny = 2 * cy + dy;
                                if (nodeOf[l + 1][ny * (1 << (l + 1)) + nx]) {
                                    stackL.push(l + 1); stackX.push(nx); stackY.push(ny);
                                }
                            }
                        }
                    }
                }
            }

            const leafForParticle = new Uint32Array(N);
            const particleIndices = new Uint32Array(N);
            {
                // Count per leaf, prefix-sum, scatter (counting sort).
                const leafOcc = new Uint32Array(nodeCount);
                for (let i = 0; i < N; i++) {
                    const px = Math.min(0.999999, Math.max(0.0, pos[i * stride]));
                    const py = Math.min(0.999999, Math.max(0.0, pos[i * stride + 1]));
                    const ix = Math.min(leafSide - 1, (px * leafSide) | 0);
                    const iy = Math.min(leafSide - 1, (py * leafSide) | 0);
                    const leaf = leafForCell[iy * leafSide + ix];
                    leafForParticle[i] = leaf;
                    leafOcc[leaf]++;
                }
                const cursor = new Uint32Array(nodeCount);
                let acc = 0;
                for (let n = 0; n < nodeCount; n++) {
                    cursor[n] = acc;
                    nodeParticleRange[n * 2] = acc;
                    nodeParticleRange[n * 2 + 1] = leafOcc[n];
                    acc += leafOcc[n];
                }
                for (let i = 0; i < N; i++) {
                    const leaf = leafForParticle[i];
                    particleIndices[cursor[leaf]++] = i;
                }
            }

            // ---- 5) adaptive FMM interaction lists (port of the Python ref) ----
            // List 1 (P2P): for each leaf, all adjacent leaves (incl. self).
            // Found by walking the 3x3 colleagues of the leaf and of each
            // ancestor, descending only through cells adjacent to the leaf.
            // List 2 (M2L): for each node with a parent, the parent's
            // colleagues' children that are NOT adjacent to the node.
            // List 3/4 (dual): for each leaf, descend colleagues' subtrees:
            // a node adjacent to the leaf is recursed into; the first
            // non-adjacent node becomes an M2P source for the leaf (List 3)
            // and the leaf becomes a P2L source for that node (List 4).
            // Offsets are per-list (list l's entries are contiguous in the
            // flattened array in list order 0..3). A shared cursor across
            // lists — as an earlier revision had — records offsets that land
            // in the wrong region of listData whenever several lists
            // interleave, silently corrupting the WGSL neighbor reads.
            const listOffsets = new Uint32Array(nodeCount * 4);
            const listCounts = new Uint32Array(nodeCount * 4);
            const listDataArrays = [[], [], [], []];
            const listCursors = [0, 0, 0, 0];
            let listCursor = 0; // total entries (buffer sizing only)
            // List 4 is dual to List 3: many leaves append to the SAME node
            // across leaf iterations, so chronological appends interleave and
            // per-node runs would not be contiguous. Collect (node, leaf)
            // pairs and counting-sort them per node instead.
            const l4Nodes = [], l4Leaves = [];
            const visited = new Uint32Array(nodeCount);
            let visitGen = 0;

            const appendList = (node, li, value) => {
                if (listCounts[node * 4 + li] === 0) {
                    listOffsets[node * 4 + li] = listCursors[li];
                }
                listDataArrays[li].push(value);
                listCursors[li]++;
                listCursor++;
                listCounts[node * 4 + li]++;
            };

            const sameLevelNode = (l, ix, iy) => {
                const side = 1 << l;
                if (ix < 0 || iy < 0 || ix >= side || iy >= side) return -1;
                const nm = nodeOf[l][iy * side + ix];
                return nm ? levelStart[l] + nm - 1 : -1;
            };

            // Iterative descent for List 1: visit only nodes whose cell is
            // adjacent to the leaf; terminal visitors join List 1.
            const descendAdjacent = (leafIdx, leafLevel, startNode, startLevel, sx, sy, out) => {
                const stackN = [startNode], stackL = [startLevel], stackX = [sx], stackY = [sy];
                while (stackN.length) {
                    const n = stackN.pop(), l = stackL.pop(), cx = stackX.pop(), cy = stackY.pop();
                    if (visited[n] === visitGen) continue;
                    visited[n] = visitGen;
                    if (!cellsTouch(leafLevel, nodeCell[leafIdx * 2], nodeCell[leafIdx * 2 + 1], l, cx, cy)) continue;
                    if (nodeIsLeaf[n]) {
                        out.push(n);
                    } else {
                        for (let dy = 0; dy < 2; dy++) {
                            for (let dx = 0; dx < 2; dx++) {
                                const nx = 2 * cx + dx, ny = 2 * cy + dy;
                                const ch = sameLevelNode(l + 1, nx, ny);
                                if (ch >= 0) { stackN.push(ch); stackL.push(l + 1); stackX.push(nx); stackY.push(ny); }
                            }
                        }
                    }
                }
            };

            // List 2 for every node at level >= 1 (leaves included: their
            // local expansion is evaluated by L2P for their own particles).
            for (let l = 1; l < numLevels; l++) {
                const side = 1 << l;
                const map = nodeOf[l];
                for (let iy = 0; iy < side; iy++) {
                    for (let ix = 0; ix < side; ix++) {
                        if (!map[iy * side + ix]) continue;
                        const idx = levelStart[l] + map[iy * side + ix] - 1;
                        const pix = ix >> 1, piy = iy >> 1;
                        for (let pdy = -1; pdy <= 1; pdy++) {
                            for (let pdx = -1; pdx <= 1; pdx++) {
                                const pnx = pix + pdx, pny = piy + pdy;
                                const pc = sameLevelNode(l - 1, pnx, pny);
                                if (pc < 0) continue;
                                for (let cdy = 0; cdy < 2; cdy++) {
                                    for (let cdx = 0; cdx < 2; cdx++) {
                                        const cnx = (pnx << 1) + cdx, cny = (pny << 1) + cdy;
                                        const ch = sameLevelNode(l, cnx, cny);
                                        if (ch < 0) continue;
                                        if (Math.abs(cnx - ix) <= 1 && Math.abs(cny - iy) <= 1) continue;
                                        appendList(idx, 1, ch);
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // Lists 1, 3, 4 per leaf.
            for (const b of leafIds) {
                const lb = nodeCenterSize[b * 4 + 3];
                const bx = nodeCell[b * 2], by = nodeCell[b * 2 + 1];
                visitGen++;
                visited[b] = visitGen;
                const l1 = [b];

                // List 3/4 helpers for this leaf.
                const inspect = (startNode, startLevel, sx, sy) => {
                    const stackN = [startNode], stackL = [startLevel], stackX = [sx], stackY = [sy];
                    while (stackN.length) {
                        const n = stackN.pop(), l = stackL.pop(), cx = stackX.pop(), cy = stackY.pop();
                        if (cellsTouch(lb, bx, by, l, cx, cy)) {
                            if (!nodeIsLeaf[n]) {
                                for (let dy = 0; dy < 2; dy++) {
                                    for (let dx = 0; dx < 2; dx++) {
                                        const nx = 2 * cx + dx, ny = 2 * cy + dy;
                                        const ch = sameLevelNode(l + 1, nx, ny);
                                        if (ch >= 0) { stackN.push(ch); stackL.push(l + 1); stackX.push(nx); stackY.push(ny); }
                                    }
                                }
                            }
                        } else {
                            // First non-adjacent node: M2P source for b,
                            // and b is a P2L source for it (dual lists).
                            appendList(b, 2, n);
                            l4Nodes.push(n);
                            l4Leaves.push(b);
                        }
                    }
                };

                let ax = bx, ay = by;
                for (let l = lb; l >= 0; l--) {
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const c = sameLevelNode(l, ax + dx, ay + dy);
                            if (c < 0 || c === b) continue;
                            if (l === lb) {
                                // Same-level colleague: adjacent by
                                // construction (3x3 neighborhood) — descend
                                // for List 1 and inspect for Lists 3/4.
                                descendAdjacent(b, lb, c, l, ax + dx, ay + dy, l1);
                                inspect(c, l, ax + dx, ay + dy);
                            } else {
                                // Ancestor-level colleague: descend for
                                // List 1 (adjacent coarse/fine leaves).
                                descendAdjacent(b, lb, c, l, ax + dx, ay + dy, l1);
                            }
                        }
                    }
                    if (l > 0) { ax >>= 1; ay >>= 1; }
                }
                for (const n of l1) appendList(b, 0, n);
            }

            // The flattened array concatenates the four lists' entries in
            // order [L1][L2][L3][L4]; a list's recorded offset is its
            // within-block position, so add each block's base offset.
            {
                const base = [0, 0, 0, 0];
                for (let li = 1; li < 4; li++) base[li] = base[li - 1] + listDataArrays[li - 1].length;
                for (let node = 0; node < nodeCount; node++) {
                    for (let li = 0; li < 3; li++) {
                        if (listCounts[node * 4 + li] > 0) listOffsets[node * 4 + li] += base[li];
                    }
                }
                // List 4: counting-sort the (node, leaf) pairs by node so
                // each node's P2L sources are contiguous, then assign
                // offsets relative to the list-4 block base.
                const l4Count = new Uint32Array(nodeCount);
                for (let k = 0; k < l4Nodes.length; k++) l4Count[l4Nodes[k]]++;
                const l4Cursor = new Uint32Array(nodeCount);
                let l4Acc = 0;
                for (let n = 0; n < nodeCount; n++) {
                    l4Cursor[n] = l4Acc;
                    if (l4Count[n] > 0) {
                        listOffsets[n * 4 + 3] = base[3] + l4Acc;
                        listCounts[n * 4 + 3] = l4Count[n];
                    }
                    l4Acc += l4Count[n];
                }
                for (let k = 0; k < l4Nodes.length; k++) {
                    listDataArrays[3][l4Cursor[l4Nodes[k]]++] = l4Leaves[k];
                }
            }

            // Flatten list data into a single typed array
            const listData = new Uint32Array(
                listDataArrays[0].length + listDataArrays[1].length +
                listDataArrays[2].length + listDataArrays[3].length);
            let copyOff = 0;
            for (let li = 0; li < 4; li++) {
                for (let j = 0; j < listDataArrays[li].length; j++) {
                    listData[copyOff++] = listDataArrays[li][j];
                }
            }

            // ---- 6) Materialized per-target far-field CSR (round 13) -----
            // For every LEAF t: the flat concatenation over levels l =
            // t.level .. 1 of List-2(ancestor_l(t)) — exactly the M2L source
            // set the per-level m2l+l2l chain delivers to t, resolved ONCE
            // per metadata refresh so the GPU evaluates it as a flat gather
            // (far_gather kernel) instead of per-level dispatches with inline
            // transcendental M2L math. Each entry packs the source node index
            // (low 22 bits) with the precomputed per-(level, offset)
            // operator row index l*49 + (dy+3)*7 + (dx+3) (top 10 bits) into
            // ONE u32; offsets are bounded to [-3,3] by the List-2
            // construction (children of the parent's 3x3 colleague ring).
            // Entries are grouped by descending level (leaf's own level
            // first) so the kernel shifts each level's gathered run to the
            // leaf center once per run.
            const farStart = new Uint32Array(nodeCount);
            const farCount = new Uint32Array(nodeCount);
            let farEntriesArr = null;
            if (nodeCount >= (1 << 22)) {
                // Source index would overflow the 22-bit packing; the
                // dispatcher falls back to the per-level chain (null
                // farEntries is the flag). Unreachable below ~4M nodes.
                console.warn('adaptive far CSR disabled: nodeCount ' + nodeCount + ' exceeds the 22-bit source packing.');
            } else {
                for (const b of leafIds) {
                    let cnt = 0, a = b;
                    for (let l = nodeCenterSize[b * 4 + 3] | 0; l >= 1; l--) {
                        cnt += listCounts[a * 4 + 1];
                        a = nodeParent[a];
                    }
                    farCount[b] = cnt;
                }
                let farTotal = 0;
                for (const b of leafIds) {
                    farStart[b] = farTotal;
                    farTotal += farCount[b];
                }
                const farEntries = new Uint32Array(farTotal);
                for (const b of leafIds) {
                    let cur = farStart[b], a = b;
                    for (let l = nodeCenterSize[b * 4 + 3] | 0; l >= 1; l--) {
                        const ax = nodeCell[a * 2], ay = nodeCell[a * 2 + 1];
                        const lo = listOffsets[a * 4 + 1], lc = listCounts[a * 4 + 1];
                        for (let q = 0; q < lc; q++) {
                            const src = listData[lo + q];
                            const row = l * 49 + (ay - nodeCell[src * 2 + 1] + 3) * 7
                                      + (ax - nodeCell[src * 2] + 3);
                            farEntries[cur++] = src | (row << 22);
                        }
                        a = nodeParent[a];
                    }
                }
                farEntriesArr = farEntries;
                // Sizes logged sparsely (worker context: under the accelerated
                // refresh cadence this fired ~10x/s — a measurable DevTools
                // protocol cost in long runs). Every 64th rebuild keeps the
                // CSR cost visible in the console record without the spam.
                buildAdaptiveMetadata.farCsrLogs = (buildAdaptiveMetadata.farCsrLogs || 0) + 1;
                if (buildAdaptiveMetadata.farCsrLogs % 64 === 1) {
                    console.debug('adaptive far CSR: leaves=' + leafIds.length + ' entries=' + farTotal +
                        ' (' + (farTotal / Math.max(1, leafIds.length)).toFixed(1) + '/leaf,' +
                        ' entries+header bytes=' + ((farTotal + 2 * nodeCount) * 4) +
                        ', ops table bytes=' + (11 * 49 * 50 * 4) + ')');
                }
            }
            const farOps = buildFarOperatorTable();

            // P2P budget warning: List-1 is total-samples/particle (48/32/16
            // tiered by N). When the densest leaf exceeds that budget the
            // near-field is subsampled (sampleWeight capped at 8 under
            // collapse). Warn once. See GPU_NOTES §5.4 / §10.4.
            let maxLeafParticles = 0;
            for (let idx = 0; idx < nodeCount; idx++) {
                if (!nodeIsLeaf[idx]) continue;
                const c = nodeParticleRange[idx * 2 + 1];
                if (c > maxLeafParticles) maxLeafParticles = c;
            }
            const p2pBudgetN = p2pBudgetOverride > 0 ? p2pBudgetOverride
                : p2pBudgetAutoForN(N);
            if (maxLeafParticles > p2pBudgetN && !p2pBudgetWarned) {
                p2pBudgetWarned = true;
                const frac = ((p2pBudgetN / Math.max(1, maxLeafParticles)) * 100).toFixed(1);
                console.warn(`p2pBudget subsampling: max leaf occupancy ${maxLeafParticles} > total budget ${p2pBudgetN}/particle (N=${N}, maxDepth=${D}, leafTarget=${leafTarget}); near-field P2P spreads ${p2pBudgetN} samples across List-1 (${frac}% of densest-leaf mass if spent on one leaf; sampleWeight capped at 8 under collapse). Raise it with ?p2pbudget=${Math.min(4096, p2pBudgetN * 2)}. See docs/GPU_NOTES.md §5.4 / §10.4.`);
            }

            // Funnel-hash occupied-node directory: insert every existing
            // node key (level<<20 | iy<<10 | ix) -> node index into a
            // FunnelTable sized to nodeCount. delta=1/16 keeps the probe
            // bound short. The packed table (keys + values + geometry) is
            // uploaded as the adaptiveNodeHash buffer and probed by the
            // adaptive WGSL l2p kernel when useAdaptiveNodeHash is set: it
            // derives the deepest-level cell from the particle position and
            // walks up until the probe hits the containing leaf.
            // CPU verification: every occupied node must be findable via
            // probe; warn once on failure (not a throw — the legacy
            // leafForParticle path is the fallback when
            // useAdaptiveNodeHash == 0). The directory (and its per-rebuild
            // build + upload cost) is only materialized when the L2P will
            // actually probe it; otherwise the packed array stays empty and
            // the shader reads leafForParticle exclusively.
            let nodeHash = null;
            let hashFailures = 0;
            if (useAdaptiveNodeHash) {
                nodeHash = new FunnelTable(nodeCount, 1.0 / 16.0);
                for (let l = 0; l < numLevels; l++) {
                    const side = 1 << l;
                    const map = nodeOf[l];
                    for (let iy = 0; iy < side; iy++) {
                        for (let ix = 0; ix < side; ix++) {
                            if (!map[iy * side + ix]) continue;
                            const idx = levelStart[l] + map[iy * side + ix] - 1;
                            const key = (l << 20) | (iy << 10) | ix;
                            const slot = nodeHash.insert(key >>> 0, idx);
                            if (slot < 0) { hashFailures++; continue; }
                            // Verify round-trip (cheap; every rebuild but warn-once).
                            if (nodeHash.probe(key >>> 0) !== idx) { hashFailures++; }
                        }
                    }
                }
                if (hashFailures > 0 && !adaptiveNodeHashWarned) {
                    adaptiveNodeHashWarned = true;
                    console.warn(`adaptiveNodeHash: ${hashFailures}/${totalNodes} nodes failed insert/probe (delta=1/16, capacity=${totalNodes}); falling back to leafForParticle when useAdaptiveNodeHash==0. The WGSL probe is authoritative; this JS verify is a build-time sanity check.`);
                }
            }

            return {
                depth: D,
                leafTarget,
                leafCount: leafIds.length,
                maxLeafParticles,
                numLevels,
                totalNodes,
                levelStart,
                levelCount,
                nodeCenterSize,
                nodeMeta,
                nodeChildren,
                nodeParticleRange,
                leafForParticle,
                particleIndices,
                listOffsets,
                listCounts,
                listData,
                farStart,
                farCount,
                farEntries: farEntriesArr,
                farOps,
                nodeHashKeys: nodeHash ? nodeHash.keys : null,
                nodeHashValues: nodeHash ? nodeHash.values : null,
                nodeHashGeom: nodeHash ? nodeHash.geom.packed : null,
                nodeHashGeomSize: nodeHash ? nodeHash.geom.totalSize : 0,
                // Packed upload layout (geom | keys | values) matching the
                // shader's single-binding nodeHash buffer. Empty (16 zero
                // u32) when the directory is disabled; the shader never
                // probes binding 16 unless useAdaptiveNodeHash == 1.
                nodeHashPacked: (() => {
                    if (!nodeHash) { return new Uint32Array(16); }
                    const g = nodeHash.geom.packed, k = nodeHash.keys, v = nodeHash.values;
                    const buf = new Uint32Array(g.length + k.length + v.length);
                    buf.set(g, 0); buf.set(k, g.length); buf.set(v, g.length + k.length);
                    return buf;
                })(),
            };
        }

        function updateGalaxyCores(dt) {
            if (scenario !== 'galaxy') return;
            // Standard self-gravity ICs have no analytic cores (coreGM = 0 via
            // SimParams; generateParticles pins both at the center with zero
            // mass and velocity). Nothing to integrate.
            if (galaxyIC !== 'flyby') return;
            const dx = core2.x - core1.x;
            const dy = core2.y - core1.y;
            // Same softened Plummer potential as the compute shader's analytic
            // core (eps = 0.038). G = 0.00075 so G*m1*m2 = GM_core = 0.00075,
            // matching the force a test particle feels from one core. See the
            // derivation comment in generateParticles().
            const epsSq = 0.038 * 0.038; // 0.001444
            const r_sq = dx * dx + dy * dy + epsSq;
            const inv_r = 1.0 / Math.sqrt(r_sq);
            const inv_r3 = inv_r * inv_r * inv_r;
            const G = 0.00075;

            const f12x = dx * (G * core2.mass * inv_r3);
            const f12y = dy * (G * core2.mass * inv_r3);

            core1.vx += f12x * dt * simSpeed;
            core1.vy += f12y * dt * simSpeed;
            core2.vx -= f12x * dt * simSpeed;
            core2.vy -= f12y * dt * simSpeed;

            // Soft repulsive core: prevents the two gravity centers from
            // merging too close during pericenter passage, so disks survive
            // several flybys. dx/dy point from core1 to core2, so core1 is
            // pushed back (-d) and core2 forward (+d).
            const sep = Math.sqrt(dx * dx + dy * dy);
            const minSep = 0.12;
            if (sep > 1e-4 && sep < minSep) {
                const rep = (minSep - sep) / minSep;
                const rx = dx / sep, ry = dy / sep;
                const repK = 0.03;
                core1.vx -= rx * rep * repK * dt * simSpeed;
                core1.vy -= ry * rep * repK * dt * simSpeed;
                core2.vx += rx * rep * repK * dt * simSpeed;
                core2.vy += ry * rep * repK * dt * simSpeed;
            }

            core1.x += core1.vx * dt * simSpeed;
            core1.y += core1.vy * dt * simSpeed;
            core2.x += core2.vx * dt * simSpeed;
            core2.y += core2.vy * dt * simSpeed;

            // Very weak barycenter centering (not a harmonic anchor — just
            // keeps the encounter on-screen by countering tiny numerical drift
            // from the soft repulsion). 15x weaker than the old anchor.
            const centerK = 0.001;
            const bx = (core1.x + core2.x) * 0.5 - 0.5;
            const by = (core1.y + core2.y) * 0.5 - 0.5;
            core1.vx -= bx * centerK * dt * simSpeed;
            core1.vy -= by * centerK * dt * simSpeed;
            core2.vx -= bx * centerK * dt * simSpeed;
            core2.vy -= by * centerK * dt * simSpeed;
        }

        // Optional deterministic IC stream for controlled browser benchmarks.
        // Normal interactive sessions keep the browser's default RNG.
        const seedParam = Number(new URLSearchParams(location.search).get('seed'));
        let seededState = Number.isFinite(seedParam) ? (seedParam >>> 0) : 0;
        const resetSeededRandom = () => { if (Number.isFinite(seedParam)) seededState = seedParam >>> 0; };
        if (Number.isFinite(seedParam)) {
            Math.random = () => {
                seededState = (seededState + 0x6D2B79F5) | 0;
                let t = seededState;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // ====================================================================
        // STANDARD SELF-GRAVITY SCENARIOS (galaxy ICs; see GPU_NOTES §15)
        // ====================================================================
        // The demo's particle-particle gravity is 2D LOGARITHMIC and
        // ATTRACTIVE: each pair interacts through the confining softened
        // potential
        //     U(r) = +(Gp/2) * ln(r^2 + eps^2),  F = -Gp * r_vec / (r^2 + eps^2)
        // (eps^2 = 4e-5, the shared P2P_EPS2; log gravity has a 2D Gauss law,
        // so F(R) = G*M_enc(R)/R for any axisymmetric disk). These constants
        // define the two stellar-dynamics-standard validation scenarios in
        // that exact force law (derivations + measured results in
        // docs/GPU_NOTES.md §15):
        //   virialized log-disk: Sigma(R) = M/(pi a^2) (1+R^2/a^2)^-2 with
        //     M_enc(R) = M R^2/(R^2+a^2) and v_c(R) = sqrt(GM) R/sqrt(R^2+a^2),
        //     supported by rotation + dispersion (2K = sum R*F, virial by
        //     construction; NOT an exact DF solution — see §15 for why the
        //     exact isotropic Jeans dispersion of this profile diverges at
        //     the center);
        //   cold collapse: uniform disk of radius R0, Q = 0, interior force
        //     exactly harmonic (F = G pi Sigma0 R), so the global free-fall
        //     time of the unsoftened system is t_ff = pi / (2 sqrt(G M)/R0).
        // G = 1 and the per-particle mass is mu/N, so the total G*M = mu is
        // N-independent. The flyby ICs instead keep Gp_total = 0.015 with the
        // analytic dual cores carrying half the mass in FMM mode; the standard
        // ICs have NO analytic cores (coreGM = 0 below) — pure self-gravity.
        // The exact Hamiltonian both scenarios conserve:
        //   E = sum |v|^2/2 + (Gp/4) sum_i sum_{j!=i} ln(r_ij^2 + eps^2)
        let galaxyIC = 'flyby';       // 'flyby' | 'plummer' | 'collapse'
        let vortexIC = 'sheet';       // 'sheet' | 'lamb_oseen'
        const SELF_GRAV_MU = 0.002;   // total G*M of the self-gravitating disk
        const SELF_GRAV_A = 0.1;      // log-Plummer scale radius (box units)
        const LOG_DISK_RMAX = 0.40;   // truncate the infinite-tail IC inside the box
        const COLD_COLLAPSE_R0 = 0.3; // cold-uniform-disk radius (box units)
        const SELF_GRAV_DIAG_MAX_N = 200000; // energy diagnostic is O(N^2): cap it

        function generateParticles() {
            resetSeededRandom();
            // ==================================================================
            // GALAXY INITIAL CONDITIONS — Toomre & Toomre-style interacting pair
            // ==================================================================
            // Two equal-mass (m=1) galaxies on an eccentric mutual orbit. The
            // core orbit uses the SAME softened Plummer potential the particles
            // feel in the compute shader (GM_core = 0.00075, eps = 0.038), so
            // the mutual force is physically consistent with the disk gravity.
            //
            // Derivation of the mutual G:
            //   Particle force from one core: F = GM_core * r / (r^2 + eps^2)^(3/2)
            //   Mutual force between cores:   F = G_mut * m1 * m2 * r / (r^2 + eps^2)^(3/2)
            //   Consistency requires: G_mut * m1 * m2 = GM_core
            //   With m1 = m2 = 1: G_mut = 0.00075
            //
            // Circular speed at separation d (two-body, softened). Setting
            // centripetal acceleration v_rel^2/d = G(m1+m2) d/(d^2+eps^2)^(3/2)
            // gives the d^3 numerator (d, not d^2, would be the force itself):
            //   v_circ = sqrt(G_mut * (m1+m2) * d^3 / (d^2 + eps^2)^(3/2))
            //          = sqrt(0.0015 * d^3 / (d^2 + 0.001444)^(3/2))
            //
            // At d = 0.45: v_circ ~ 0.0385. Near-parabolic: v_rel = 1.1 * v_circ ~ 0.0424.
            // Each core gets v_rel/2 ~ 0.0212 (equal mass, COM frame).
            if (scenario === 'galaxy') {
                if (galaxyIC !== 'flyby') {
                    // Standard self-gravity ICs (log-Plummer / cold collapse):
                    // NO analytic cores. coreGM arrives 0 through SimParams and
                    // updateGalaxyCores() returns early, so both cores stay
                    // pinned at the box center with zero mass and velocity.
                    core1 = { x: 0.5, y: 0.5, vx: 0.0, vy: 0.0, mass: 0.0 };
                    core2 = { x: 0.5, y: 0.5, vx: 0.0, vy: 0.0, mass: 0.0 };
                } else {
                    const dSep = 0.45;
                    const epsCore = 0.038;
                    const epsCoreSq = epsCore * epsCore;
                    const GMtotal = 0.0015; // 2 * 0.00075
                    const vCirc = Math.sqrt(GMtotal * dSep * dSep * dSep / Math.pow(dSep * dSep + epsCoreSq, 1.5));
                    const vRel = 1.1 * vCirc; // near-parabolic (eccentric flyby)
                    const vCore = vRel / 2;
                    // Barycenter at screen center. Separation along x, velocity
                    // along y → orbital angular momentum in +z (out of screen).
                    core1 = { x: 0.5 - dSep / 2, y: 0.5, vx: 0, vy: vCore, mass: 1.0 };
                    core2 = { x: 0.5 + dSep / 2, y: 0.5, vx: 0, vy: -vCore, mass: 1.0 };
                }
            } else {
                core1 = { x: 0.25, y: 0.45, vx: 0.024, vy: 0.011, mass: 1.0 };
                core2 = { x: 0.75, y: 0.55, vx: -0.024, vy: -0.011, mass: 1.0 };
            }

            for (let i = 0; i < N; i++) {
                let px = 0.5, py = 0.5, vx = 0, vy = 0, grp = 0.0, state = 0.0;

                if (scenario === 'galaxy') {
                    scenarioId = 0;

                    if (galaxyIC === 'plummer') {
                        // VIRIALIZED LOG-DISK (GPU_NOTES §15). Surface density
                        // Sigma(R) = M/(pi a^2) (1+R^2/a^2)^-2, sampled by
                        // inverse CDF from the enclosed mass (2D Gauss law of
                        // log gravity) M_enc(R) = M R^2/(R^2+a^2):
                        //   R = a sqrt(u/(1-u)).
                        // Circular speed of its own field: v_c(R) =
                        // sqrt(G M_enc(R)/R) = sqrt(G M) R/sqrt(R^2+a^2).
                        // Support = rotation + dispersion (standard practice
                        // for N-body disk ICs): v_phi = v_c sqrt(1-s^2) with
                        // s = 0.3, plus an isotropic Gaussian of width s*v_c.
                        // This is virialized BY CONSTRUCTION (2K = sum R*F for
                        // centrifugal balance) but NOT an exact DF solution —
                        // the exact isotropic Jeans solution of this profile
                        // has a central dispersion divergence (1/R geometric
                        // term; measured and documented in GPU_NOTES §15), so
                        // the scenario tests that the engine HOLDS a bound
                        // virialized disk together (Lagrangian-radii
                        // stability + dE/E conservation), not frozen structure.
                        // The analytic profile has infinite radial support, but
                        // this demo lives in a finite [0,1]^2 box. Truncate and
                        // renormalize the inverse CDF instead of initializing
                        // tail particles outside the box and letting the wall
                        // clamp create artificial expansion/bounces.
                        const u = Math.max(1e-9, Math.min(1.0 - 1e-9, Math.random()));
                        const rMax2 = LOG_DISK_RMAX * LOG_DISK_RMAX;
                        const a2 = SELF_GRAV_A * SELF_GRAV_A;
                        const cdfMax = rMax2 / (rMax2 + a2);
                        const uTruncated = u * cdfMax;
                        const R = SELF_GRAV_A * Math.sqrt(uTruncated / (1.0 - uTruncated));
                        const th = Math.random() * Math.PI * 2.0;
                        const ct = Math.cos(th), st = Math.sin(th);
                        px = 0.5 + R * ct;
                        py = 0.5 + R * st;
                        const vC = Math.sqrt(SELF_GRAV_MU) * R / Math.sqrt(R * R + a2);
                        const s = 0.3;               // dispersion fraction
