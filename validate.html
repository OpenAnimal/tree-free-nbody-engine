<script>
"use strict";

// ========================================================================
// VERBATIM BLOCKS FROM index.html (2026-08-26) — spliced by the build step.
// ========================================================================
const wgslComputeSource = `

        struct Particle {
            pos: vec2<f32>,
            vel: vec2<f32>,
        };

        struct ParticleExtra {
            prevVel: vec2<f32>,
            group: f32,
            state: f32,
        };

        // farFieldModel (independent of near-field hash):
        //   0 = none       — analytic / local forces only
        //   1 = gravity    — adaptive FMM multipoles in fmmField (all-pairs self-gravity)
        //   2 = centroids  — order-0 cell barycenter + mean vel in fmmField.xyzw
        //   3 = biot       — reserved (Biot-Savart multipoles; not implemented)
        // Gravity multipoles are NOT "scenario=galaxy magic"; they require a
        // long-range kernel. Boids want centroids, not log-gravity. SPH is
        // compact-support => usually none. See HTML comment on #selectFarField.
        struct SimParams {
            dt: f32,
            simTime: f32,
            numParticles: u32,
            scenario: u32,
            p2pRadius: f32,
            speedMult: f32,
            use1Euro: u32,
            colorMode: u32,
            mouseX: f32,
            mouseY: f32,
            mouseMode: f32,
            isMouseDown: f32,
            g1x: f32,
            g1y: f32,
            g2x: f32,
            g2y: f32,
            fmmEnabled: u32,       // 1 => gravity multipole path wrote fmmField
            adaptiveMode: u32,
            leafBits: u32,
            p2pListCap: u32,
            useElasticHash: u32, // T3: 1 => P2P cell lookups probe the open-addr hash
            useQuantized: u32,   // T4: reserved (pack/unpack run as separate passes)
            useFunnelHash: u32,  // T6.4: 1 => P2P cell lookups probe the funnel hash
            cellListsReady: u32, // 1 => near-field cell lists valid this frame (any hash backend)
            useSortedPayload: u32, // 1 => sortedParticles is valid; main compute iterates over sorted slots
            farFieldModel: u32,  // 0 none | 1 gravity | 2 centroids | 3 biot(reserved)
            nfProbeMode: u32,    // 0 dense cellStart/cellCount (default; ?nfprobe=1 A/B: 1 open-addr probe per neighbor, 2 funnel probe per neighbor)
            coreGM: f32,         // analytic core GM each: flyby ICs run full
                                 // 0.00075 (no far field) / half 0.000375 (FMM
                                 // or direct on); the standard self-gravity
                                 // ICs run 0 (no cores, particles only)
            gpPerParticle: f32,  // particle-particle gravity constant: flyby
                                 // 0.015/N (calibrated visual split); standard
                                 // ICs mu/N with G=1 (pure self-gravity)
        };

        @group(0) @binding(0) var<storage, read> posVelIn: array<Particle>;
        @group(0) @binding(1) var<storage, read_write> posVelOut: array<Particle>;
        @group(0) @binding(2) var<storage, read_write> extras: array<ParticleExtra>;
        @group(0) @binding(3) var<uniform> params: SimParams;
        // Fixed-grid FMM data. Cell occupancy comes from the counting-sort
        // passes in the FMM shader: cellStart/cellCount describe contiguous
        // particle ranges of sortedIndex, which replace the old atomic linked
        // lists (no heads/next pointer chasing, no hash table).
        @group(0) @binding(4) var<storage, read> fmmField: array<vec4<f32>>;
        @group(0) @binding(5) var<storage, read> fmmSortedIndex: array<u32>;
        @group(0) @binding(6) var<storage, read> cellStart: array<u32>;
        @group(0) @binding(7) var<storage, read> cellCount: array<u32>;
        // T3 elastic-hash cell membership (read-only here; the FMM build
        // passes write them atomically). Declared as plain arrays since this
        // shader only reads them AFTER the build passes complete, and WGSL
        // atomics require read_write storage (the build shaders use the
        // atomic view via the FMM bind group layout).
        @group(0) @binding(8) var<storage, read> ehKeys: array<u32>;
        @group(0) @binding(9) var<storage, read> ehCount: array<u32>;
        @group(0) @binding(10) var<storage, read> ehStart: array<u32>;
        // T6.4 funnel-hash geometry (read-only; layout documented in
        // computeFunnelGeometry() on the JS side). Bound to a 4-byte-aligned
        // u32 storage buffer; ignored unless params.useFunnelHash == 1.
        @group(0) @binding(11) var<storage, read> funnelGeom: array<u32>;
        // Sorted payload: particle data re-ordered by cell so P2P neighbor
        // reads are contiguous (coalesced). Written by gather_sorted in the
        // FMM shader after scatter_cells; read here when useSortedPayload == 1.
        @group(0) @binding(12) var<storage, read> sortedParticles: array<Particle>;
        // Shared softening length^2: identical to the P2P kernel below and to
        // the ring M2P / parent M2L monopole terms so the force field stays
        // continuous across the P2P / ring / M2L zone boundaries.
        const P2P_EPS2: f32 = 0.00004;
        const EH_EMPTY: u32 = 0xFFFFFFFFu;
        fn leafIndex(p: vec2<f32>) -> u32 {
            let side = 1u << params.leafBits;
            let cx = min(u32(clamp(p.x, 0.0, 0.999999) * f32(side)), side - 1u);
            let cy = min(u32(clamp(p.y, 0.0, 0.999999) * f32(side)), side - 1u);
            return cy * side + cx;
        }
        // T3 helpers (mirror the FMM shader; u32 splitmix mix + linear probe).
        fn hashU32(k: u32) -> u32 {
            var x = k ^ 0x9E3779B9u;
            x = x ^ (x >> 16);
            x = x * 0x7FEB352Du;
            x = x ^ (x >> 15);
            x = x * 0x846CA68Bu;
            x = x ^ (x >> 16);
            return x;
        }
        fn ehTableSize() -> u32 { return 1u << (2u * params.leafBits + 1u); }
        fn ehProbe(cell: u32) -> u32 {
            let mask = ehTableSize() - 1u;
            var slot = hashU32(cell) & mask;
            for (var i: u32 = 0u; i < 8192u; i = i + 1u) {
                let k = ehKeys[slot];
                if (k == cell) { return slot; }
                if (k == EH_EMPTY) { return slot; }
                slot = (slot + 1u) & mask;
            }
            return slot;
        }
        // Dense direct lookup by default. The FMM pipeline's materialize_ranges
        // pass resolves the elastic/funnel table into cellStart/cellCount ONCE
        // per frame (one probe per leaf cell) after the hash build, so these
        // per-particle P2P loops — which visit 9 neighbor cells each — read two
        // direct u32 loads instead of paying the divergent probe chain per
        // neighbor. The counting-sort backend writes the same arrays via its
        // own scan pass, so all backends land here: equal fps across backends
        // is BY DESIGN on this path (the hash choice only affects build time).
        // ?nfprobe=1 opts into the live-hash path instead: each neighbor visit
        // probes the open-addressing (mode 1) or funnel (mode 2) table
        // directly, making the backends' probe cost visible in the FPS /
        // compute metrics — the A/B the default path deliberately removes.
        fn cellRangeOf(cell: u32) -> vec2<u32> {
            if (params.nfProbeMode == 2u) {
                let s = funnelProbe(cell);
                return vec2<u32>(ehStart[s], ehCount[s]);
            }
            if (params.nfProbeMode == 1u) {
                let s = ehProbe(cell);
                return vec2<u32>(ehStart[s], ehCount[s]);
            }
            return vec2<u32>(cellStart[cell], cellCount[cell]);
        }
        // T6.4 funnel-hash probe (Farach-Colton, Krapivin, & Kuszmaul, 2025, Section 3):
        // descend alpha slabs in order, scanning one beta-slot sub-array per
        // slab exhaustively; then overflow B (uniform probing, bAttempts) and
        // C (two-choice buckets, cBucketSlots). Bounded by funnelProbeBound()
        // = alpha*beta + bAttempts + 2*cBucketSlots slot inspections. The
        // geometry lives in the funnelGeom storage buffer (see JS
        // computeFunnelGeometry for the packing). When useFunnelHash == 1 the
        // ehKeys/ehCount/ehStart bindings point at the funnel table buffers.
        fn fgAlpha() -> u32 { return funnelGeom[0u]; }
        fn fgBeta() -> u32 { return funnelGeom[1u]; }
        fn fgBOffset() -> u32 { return funnelGeom[2u]; }
        fn fgBSize() -> u32 { return funnelGeom[3u]; }
        fn fgCOffset() -> u32 { return funnelGeom[4u]; }
        fn fgCNumBuckets() -> u32 { return funnelGeom[5u]; }
        fn fgCBucketSlots() -> u32 { return funnelGeom[6u]; }
        fn fgBAttempts() -> u32 { return funnelGeom[7u]; }
        fn fgSlabOffset(i: u32) -> u32 { return funnelGeom[11u + i]; }
        fn fgSubarrayCount(i: u32) -> u32 { return funnelGeom[11u + fgAlpha() + i]; }
        fn fgSlabSalt(i: u32) -> u32 { return funnelGeom[11u + 2u * fgAlpha() + i]; }
        fn fgBSalt(t: u32) -> u32 { return funnelGeom[11u + 3u * fgAlpha() + t]; }
        fn fgCSalt1() -> u32 { return funnelGeom[11u + 3u * fgAlpha() + fgBAttempts()]; }
        fn fgCSalt2() -> u32 { return funnelGeom[11u + 3u * fgAlpha() + fgBAttempts() + 1u]; }
        fn funnelProbe(cell: u32) -> u32 {
            let alpha = fgAlpha();
            let beta = fgBeta();
            // Funnel region: one beta-slot sub-array per slab.
            for (var i: u32 = 0u; i < alpha; i = i + 1u) {
                let aCount = fgSubarrayCount(i);
                let base = fgSlabOffset(i) + (hashU32(cell ^ fgSlabSalt(i)) % aCount) * beta;
                for (var s: u32 = 0u; s < beta; s = s + 1u) {
                    let pos = base + s;
                    let k = ehKeys[pos];
                    if (k == cell) { return pos; }
                    if (k == EH_EMPTY) { return pos; }
                }
            }
            // Overflow B: uniform probing, bAttempts slots.
            let bSize = fgBSize();
            let bOff = fgBOffset();
            let bAttempts = fgBAttempts();
            if (bSize > 0u) {
                for (var t: u32 = 0u; t < bAttempts; t = t + 1u) {
                    let pos = bOff + (hashU32(cell ^ fgBSalt(t)) % bSize);
                    let k = ehKeys[pos];
                    if (k == cell) { return pos; }
                    if (k == EH_EMPTY) { return pos; }
                }
            }
            // Overflow C: two-choice buckets of cBucketSlots slots.
            let cOff = fgCOffset();
            let cNumBuckets = fgCNumBuckets();
            let cBucketSlots = fgCBucketSlots();
            if (cNumBuckets > 0u) {
                let b1 = hashU32(cell ^ fgCSalt1()) % cNumBuckets;
                let b2 = hashU32(cell ^ fgCSalt2()) % cNumBuckets;
                for (var t: u32 = 0u; t < cBucketSlots; t = t + 1u) {
                    let pa = cOff + b1 * cBucketSlots + t;
                    let ka = ehKeys[pa];
                    if (ka == cell) { return pa; }
                    if (ka == EH_EMPTY) { return pa; }
                    let pb = cOff + b2 * cBucketSlots + t;
                    let kb = ehKeys[pb];
                    if (kb == cell) { return pb; }
                    if (kb == EH_EMPTY) { return pb; }
                }
            }
            return 0u;
        }

        @compute @workgroup_size(256, 1, 1)
        fn main(
            @builtin(global_invocation_id) global_id: vec3<u32>,
            @builtin(local_invocation_id) local_id: vec3<u32>
        ) {
            let gid = global_id.x;
            let lid = local_id.x;
            let n = params.numParticles;

            if (gid >= n) { return; }

            // When useSortedPayload == 1, gid is a SORTED slot index and
            // origId is the original particle ID. All per-particle state
            // (extras, fmmField, posVelOut) is indexed by origId. When 0,
            // gid == origId and we read posVelIn directly (legacy path).
            var origId: u32 = gid;
            var px: f32; var py: f32; var vx: f32; var vy: f32;
            if (params.useSortedPayload == 1u) {
                origId = fmmSortedIndex[gid];
                let sp = sortedParticles[gid];
                px = sp.pos.x; py = sp.pos.y; vx = sp.vel.x; vy = sp.vel.y;
            } else {
                let pp = posVelIn[gid];
                px = pp.pos.x; py = pp.pos.y; vx = pp.vel.x; vy = pp.vel.y;
            }
            let ext = extras[origId];
            let grp = ext.group;

            var fx: f32 = 0.0;
            var fy: f32 = 0.0;
            let dt = params.dt * params.speedMult;

            var nearP2PIntensity: f32 = 0.0;
            var farMultipoleIntensity: f32 = 0.0;

            // 1. SCENARIO PHYSICS EVALUATION
            if (params.scenario == 0u) {
                // Analytic dual softened cores (eps = 0.038). GM comes from
                // the uniform: the flyby ICs run both cores at full strength
                // (GM = 0.00075 each) when no far field is on and at HALF
                // strength (0.000375 each) in FMM/direct mode, where the
                // halo/bulge split keeps two distinct gravity centers while
                // the particle self-gravity supplies the other half. The
                // standard self-gravity ICs (log-Plummer / cold collapse) run
                // coreGM = 0: no analytic masses, particle-particle gravity
                // only (GPU_NOTES §15).
                let epsSq: f32 = 0.001444; // 0.038^2
                let coreGM = params.coreGM;

                // Core 1 Attraction
                let d1x = params.g1x - px;
                let d1y = params.g1y - py;
                let r1_sq = d1x * d1x + d1y * d1y + epsSq;
                let inv_r1 = inverseSqrt(r1_sq);
                let inv_r1_3 = inv_r1 * inv_r1 * inv_r1;
                let f1 = coreGM * inv_r1_3;
                fx += d1x * f1; fy += d1y * f1;

                // Core 2 Attraction
                let d2x = params.g2x - px;
                let d2y = params.g2y - py;
                let r2_sq = d2x * d2x + d2y * d2y + epsSq;
                let inv_r2 = inverseSqrt(r2_sq);
                let inv_r2_3 = inv_r2 * inv_r2 * inv_r2;
                let f2 = coreGM * inv_r2_3;
                fx += d2x * f2; fy += d2y * f2;

                if (params.fmmEnabled == 1u) {
                // Unified self-gravity constant, from the uniform. Flyby ICs:
                // the FMM uses a 2D logarithmic potential (force ~ 1/r),
                // while the analytic cores above use 3D gravity (force ~
                // 1/r^2). To match the analytic core's pull at the
                // calibrated disk radius (r ≈ 0.05):
                //   analytic: 0.00075 / r^2 = 0.3
                //   FMM:      (N/2)/r * Gp  =>  Gp = 0.3 * r / (N/2) = 0.03 / N
                // The cores supply half (0.000375 each), so the FMM Gp is
                // halved to 0.015/N to keep the total disk pull calibrated
                // while preserving two distinct gravity centers. Standard
                // self-gravity ICs: Gp = mu/N with G = 1 and per-particle
                // mass mu/N — a closed system whose exact Hamiltonian is
                // E = sum |v|^2/2 + (Gp/4) sum_i sum_{j!=i} ln(r_ij^2+eps^2)
                // (confining attractive log potential; GPU_NOTES §15).
                let Gp = params.gpPerParticle;

                // FMM far field (mass-count units). Fixed-grid L2P additionally
                // evaluates the leaf ring (Chebyshev 2..3 cells) via leaf
                // multipoles; multi-level L2P evaluates the List 1 near field
                // directly, so no substitute sampling is needed here.
                let far = fmmField[origId].xy;
                fx += far.x * Gp;
                fy += far.y * Gp;
                farMultipoleIntensity = clamp(length(far) * Gp * 20.0, 0.0, 1.0);

                if (params.adaptiveMode == 1u) {
                    // Near field is handled exactly by the multi-level L2P
                    // (List 1 adjacent-leaf P2P with softening).
                } else {
                // Fixed-grid mode: near-field P2P with FULL traversal of the
                // 3x3 leaf neighborhood using the counting-sorted contiguous
                // cell lists (cellStart/cellCount + sortedIndex). Zone
                // decomposition invariant — every pair is counted EXACTLY once:
                //   |leaf offset| <= 1  -> direct P2P here (exact, softened)
                //   |leaf offset| 2..3  -> leaf multipole M2P ring in l2p
                //                           (sources whose parent is adjacent)
                //   |parent offset| >= 2 -> parent-level M2L far field
                // The zones tile exactly: ring sources whose parent offset is
                // also >= 2 are skipped in the ring because M2L covers them.
                let side = 1u << params.leafBits;
                let leaf = leafIndex(vec2(px, py));
                let cx = leaf % side; let cy = leaf / side;
                // Cutoff rc = 2 leaf cells exactly covers the 3x3 stencil
                // (Chebyshev-adjacent cells are at most 2w apart); the slider
                // can only shrink it, never break zone coverage.
                let cellW = 1.0 / f32(side);
                let rc = min(params.p2pRadius, 2.0 * cellW);
                let rcSq = rc * rc;
                // P2P knob: full traversal of the 9 neighbor lists when they
                // are short; in dense cells, subsample each list with a fixed
                // stride and a per-particle round-robin offset (different
                // targets sample different subsets, so the aggregate stays
                // unbiased) and weight each sampled contribution by the
                // stride. The per-list cap is set from JS per particle count
                // so total near-field work stays bounded at extreme N.
                let P2P_LIST_CAP = max(8u, params.p2pListCap);
                for (var oy: i32 = -1; oy <= 1; oy++) { for (var ox: i32 = -1; ox <= 1; ox++) {
                    let nx = i32(cx) + ox; let ny = i32(cy) + oy;
                    if (nx >= 0 && nx < i32(side) && ny >= 0 && ny < i32(side)) {
                        let neighborCell = u32(ny) * side + u32(nx);
                        let cellRange = cellRangeOf(neighborCell);
                        let start = cellRange.x;
                        let count = cellRange.y;
                        let stride = max(1u, (count + P2P_LIST_CAP - 1u) / P2P_LIST_CAP);
                        let strideF = f32(stride);
                        var s: u32 = gid % stride;
                        loop {
                            if (s >= count) { break; }
                            let candidate = fmmSortedIndex[start + s];
                            if (candidate != origId) {
                                // select() evaluates BOTH operands in WGSL, so a
                                // select would keep the scattered posVelIn
                                // gather alive; branch instead (uniform cond).
                                var qpos: vec2<f32>;

        const P2P_EPS2: f32 = 0.00004;
        fn leafSide() -> u32 { return 1u << fmmParams.leafBits; }
        fn leafIndex(p: vec2<f32>) -> u32 {

        @compute @workgroup_size(256)

        @compute @workgroup_size(256)

            // exclusive prefix + chunk sum), thread 0 scans the 256 chunk sums,
            // then every thread offsets its chunk by the totals of all earlier

            // cellCursor[c] = cellStart[c] for the scatter pass.
            let tid = lid.x;

                        atomicAdd(&ehCount[pa], 1u);
                        atomicAdd(&funnelProbeCount[0u], probes);
                        return;

                        atomicAdd(&funnelProbeCount[0u], probes);
                        return;

                    probes = probes + 1u;
                    prev = atomicCompareExchangeWeak(&ehKeys[pb], EH_EMPTY, cell);

                        atomicAdd(&ehCount[pb], 1u);
                        atomicAdd(&funnelProbeCount[0u], probes);

                        atomicAdd(&funnelProbeCount[0u], probes);

// laid out with levelStart[l] = sum_{i<l} 4^i, so a dispatch of levelCount[l]

// WRONG level range (leaves missing M2L/L2L, other nodes accumulated 2-4x).
struct FmmParams {
    numParticles: u32,
    nodeCount: u32,
    expansionOrder: u32,
    levelCount: u32,   // total level count (used by resolveLeafNode via block 0)
    levelBase: u32,
    zeroNearP2P: u32,  // probe flag: 1 = skip List-1 P2P (measure multipole path only)
    dispatchCount: u32, // active threads for THIS per-level dispatch (m2m/l2l/m2l):
                       // id.x >= dispatchCount must return. Without this guard a
                       // ceil(count/64) dispatch spills surplus threads into the
                       // NEXT level's nodes; l2l/m2l accumulate read-modify-write,
                       // so spilled nodes get their locals doubled — measured 2.00x
                       // on a level-2 node by tests/core/test_adaptive_wgsl_numeric.py.
    useAdaptiveNodeHash: u32, // 1 => l2p resolves the target leaf via a funnel probe of nodeHashKeys
    p2pBudgetOverride: u32, // 0 = auto tier total samples/particle (full 4096 <=32k / 48 / 32 >2M — mirrors JS p2pBudgetAutoForN); >0 = ?p2pbudget= override
    farEntryCount: u32, // materialized far CSR entry total (farOps tail base)
};

@group(0) @binding(0) var<storage, read> particles: array<Particle>;
@group(0) @binding(1) var<storage, read> nodeCenterSize: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read> nodeParticleRange: array<vec2<u32>>;
@group(0) @binding(3) var<storage, read> leafForParticle: array<u32>;
@group(0) @binding(4) var<storage, read> particleIndices: array<u32>;
@group(0) @binding(5) var<storage, read> listOffsets: array<vec4<u32>>;
@group(0) @binding(6) var<storage, read> listCounts: array<vec4<u32>>;
@group(0) @binding(7) var<storage, read> listData: array<u32>;
@group(0) @binding(8) var<storage, read_write> multipoles: array<vec4<f32>>;
@group(0) @binding(9) var<storage, read_write> locals: array<vec4<f32>>;
@group(0) @binding(10) var<storage, read_write> fields: array<vec4<f32>>;
@group(0) @binding(11) var<uniform> params: FmmParams;
// nodeMeta packs parent (.x) and terminal flag (.y) per node into ONE
// vec2<u32> buffer (same packing as the standalone adaptive_fmm.wgsl) so
// the far-field CSR + operator table fit the 16-storage-buffer limit.
@group(0) @binding(12) var<storage, read> nodeMeta: array<vec2<u32>>;
@group(0) @binding(13) var<storage, read> nodeChildren: array<vec4<u32>>;
// Materialized per-target far-field CSR + per-(level, offset) M2L operator
// table packed into ONE u32 buffer (see the farCSR accessors below the
// coefficient helpers): [per-node start/count header | packed entries |
// farOps f32 bits]. Built worker-side per metadata refresh (round 13).
@group(0) @binding(14) var<storage, read> farCSR: array<u32>;
@group(0) @binding(15) var<storage, read> charges: array<f32>;  // T-D7: per-particle charge
// Funnel-hash occupied-node directory (read-only; built on CPU by
// FunnelTable in buildAdaptiveMetadata). Packed into ONE storage buffer to
// stay under WebGPU's 16-storage-buffer per-stage limit:
//   [0, geomSize)            packed funnel geometry (same layout as the
//                            cell-lists funnelGeom; see computeFunnelGeometry)
//   [geomSize, +totalSize)   nodeHashKeys: packed node key or AHASH_EMPTY
//   [geomSize+totalSize, ...) nodeHashValues: node index for that key
// Probed by l2p when params.useAdaptiveNodeHash == 1 to resolve the target
// leaf node from the particle position (derive cell -> pack key -> probe).
@group(0) @binding(16) var<storage, read> nodeHash: array<u32>;

const INVALID: u32 = 0xFFFFFFFFu;
const FLAG_TERMINAL: u32 = 1u;
const AHASH_EMPTY: u32 = 0xFFFFFFFFu;

fn cmul(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> {
    return vec2<f32>(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x);
}
fn cdiv(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> {
    let d = max(dot(b,b), 1e-20);
    return vec2<f32>((a.x*b.x+a.y*b.y)/d, (a.y*b.x-a.x*b.y)/d);
}
// The adaptive gravity path uses the same softened logarithmic kernel as
// List-1 P2P. Higher multipoles remain analytic; these helpers are used for
// the leading monopole contribution, including its local force coefficient.
const ADAPTIVE_P2P_EPS2: f32 = 0.00004;
fn cdivSoft(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> {
    let d = dot(b, b) + ADAPTIVE_P2P_EPS2;
    return vec2<f32>((a.x*b.x+a.y*b.y)/d, (a.y*b.x-a.x*b.y)/d);
}
fn clog(a: vec2<f32>) -> vec2<f32> {
    return vec2<f32>(0.5 * log(max(dot(a,a), 1e-20)), atan2(a.y, a.x));
}
fn clogSoft(a: vec2<f32>) -> vec2<f32> {
    return vec2<f32>(0.5 * log(max(dot(a,a) + ADAPTIVE_P2P_EPS2, 1e-20)), atan2(a.y, a.x));
}
// Complex-coefficient accessors for the packed per-node coefficient slots
// (3 vec4 = 5 complex per node: k = 0..4). which selects the buffer:
// 0 = multipoles, 1 = locals. (Selector form — identical text to the
// standalone core/webgpu_kernels/adaptive_fmm.wgsl, so check_wgsl_sync.py
// verifies the two copies against each other.)
fn readc(which: u32, node: u32, k: u32) -> vec2<f32> {
    let b = node * 3u;
    if (which == 0u) {
        if (k == 0u) { return multipoles[b].xy; }
        if (k == 1u) { return multipoles[b].zw; }
        if (k == 2u) { return multipoles[b+1u].xy; }
        if (k == 3u) { return multipoles[b+1u].zw; }
        return multipoles[b+2u].xy;
    }
    if (k == 0u) { return locals[b].xy; }
    if (k == 1u) { return locals[b].zw; }
    if (k == 2u) { return locals[b+1u].xy; }
    if (k == 3u) { return locals[b+1u].zw; }
    return locals[b+2u].xy;
}
fn writec(which: u32, node: u32, k: u32, z: vec2<f32>) {
    let b = node * 3u;
    if (which == 0u) {
        if (k == 0u) {
            let v = multipoles[b];
            multipoles[b] = vec4<f32>(z.x, z.y, v.z, v.w);
        } else if (k == 1u) {
            let v = multipoles[b];
            multipoles[b] = vec4<f32>(v.x, v.y, z.x, z.y);
        } else if (k == 2u) {
            let v = multipoles[b+1u];
            multipoles[b+1u] = vec4<f32>(z.x, z.y, v.z, v.w);
        } else if (k == 3u) {
            let v = multipoles[b+1u];
            multipoles[b+1u] = vec4<f32>(v.x, v.y, z.x, z.y);
        } else {
            let v = multipoles[b+2u];
            multipoles[b+2u] = vec4<f32>(z.x, z.y, v.z, v.w);
        }
    } else {
        if (k == 0u) {
            let v = locals[b];
            locals[b] = vec4<f32>(z.x, z.y, v.z, v.w);
        } else if (k == 1u) {
            let v = locals[b];
            locals[b] = vec4<f32>(v.x, v.y, z.x, z.y);
        } else if (k == 2u) {
            let v = locals[b+1u];
            locals[b+1u] = vec4<f32>(z.x, z.y, v.z, v.w);
        } else if (k == 3u) {
            let v = locals[b+1u];
            locals[b+1u] = vec4<f32>(v.x, v.y, z.x, z.y);
        } else {
            let v = locals[b+2u];
            locals[b+2u] = vec4<f32>(z.x, z.y, v.z, v.w);
        }
    }
}
fn isTerminal(node: u32) -> bool {
    return (nodeMeta[node].y & FLAG_TERMINAL) != 0u;
}

// ---- Materialized far-field CSR accessors + helpers (round 13) ----
// farCSR layout (one u32 storage buffer, binding 14):
//   [0 .. 2*nodeCount)              per-node header: start (2n) | count (2n+1)
//   [2n .. 2n + farEntryCount)      packed entries: source node index (low
//                                   22 bits) | operator row index (top 10)
//   [2n + farEntryCount ..)         farOps: per-(level, offset) M2L operator
//                                   table, 50 f32 (25 complex) per row, stored
//                                   as bitcast u32 words.
fn farStartOf(node: u32) -> u32 { return farCSR[2u * node]; }
fn farCountOf(node: u32) -> u32 { return farCSR[2u * node + 1u]; }
fn farEntryAt(i: u32) -> u32 { return farCSR[2u * params.nodeCount + i]; }
fn farOpsBase() -> u32 { return 2u * params.nodeCount + params.farEntryCount; }
fn farOpAt(row: u32, m: u32, k: u32) -> vec2<f32> {
    let base = farOpsBase() + row * 50u + (m * 5u + k) * 2u;
    return vec2<f32>(bitcast<f32>(farCSR[base]), bitcast<f32>(farCSR[base + 1u]));
}
fn farZero() -> array<vec2<f32>, 5> {
    return array<vec2<f32>, 5>(vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0));
}
fn farAdd(a: array<vec2<f32>, 5>, b: array<vec2<f32>, 5>) -> array<vec2<f32>, 5> {
    var out = farZero();
    for (var k = 0u; k < 5u; k = k + 1u) { out[k] = a[k] + b[k]; }
    return out;
}
// One-shot L2L recentering of a 5-coefficient local expansion by d: the
// exact polynomial shift the per-level l2l kernel applies one level at a
// time; composing exact shifts equals the single long shift, so gathering
// each ancestor level's contribution and shifting it straight to the leaf
// reproduces the chain result (same operator math as l2l below).
fn farShift(c: array<vec2<f32>, 5>, d: vec2<f32>) -> array<vec2<f32>, 5> {
    var out = farZero();
    var dpow = farZero();
    dpow[0] = vec2<f32>(1.0, 0.0);
    for (var j = 1u; j <= 4u; j = j + 1u) { dpow[j] = cmul(dpow[j - 1u], d); }
    for (var m = 0u; m <= 4u; m = m + 1u) {
        var acc = vec2<f32>(0.0);
        for (var k = m; k <= 4u; k = k + 1u) {
            var binom = 1.0;
            for (var b = 1u; b <= m; b = b + 1u) { binom *= f32(k - b + 1u) / f32(b); }
            acc += cmul(c[k], dpow[k - m]) * binom;
        }
        out[m] = acc;
    }
    return out;
}

// ---- Funnel-hash occupied-node directory probe (port of the cell-lists
// funnelProbe; same layout math as JS FunnelTable + computeFunnelGeometry).
// The WGSL probe here is the AUTHORITATIVE one; the JS FunnelTable only
// builds the table. hashU32 MUST match hashU32JS on the JS side.
fn ahashU32(k: u32) -> u32 {
    var x = k ^ 0x9E3779B9u;
    x = x ^ (x >> 16);
    x = x * 0x7FEB352Du;
    x = x ^ (x >> 15);
    x = x * 0x846CA68Bu;
    x = x ^ (x >> 16);
    return x;
}
fn ahAlpha() -> u32 { return nodeHash[0u]; }
fn ahBeta() -> u32 { return nodeHash[1u]; }
fn ahBOffset() -> u32 { return nodeHash[2u]; }
fn ahBSize() -> u32 { return nodeHash[3u]; }
fn ahCOffset() -> u32 { return nodeHash[4u]; }
fn ahCNumBuckets() -> u32 { return nodeHash[5u]; }
fn ahCBucketSlots() -> u32 { return nodeHash[6u]; }
fn ahBAttempts() -> u32 { return nodeHash[7u]; }
fn ahTotalSize() -> u32 { return nodeHash[9u]; }
// geomSize = 11 + 3*alpha + bAttempts + 2 (matches the JS packed layout).
fn ahGeomSize() -> u32 { return 11u + 3u * ahAlpha() + ahBAttempts() + 2u; }
fn ahKeysAt(pos: u32) -> u32 { return nodeHash[ahGeomSize() + pos]; }
fn ahValuesAt(pos: u32) -> u32 { return nodeHash[ahGeomSize() + ahTotalSize() + pos]; }
fn ahSlabOffset(i: u32) -> u32 { return nodeHash[11u + i]; }
fn ahSubarrayCount(i: u32) -> u32 { return nodeHash[11u + ahAlpha() + i]; }
fn ahSlabSalt(i: u32) -> u32 { return nodeHash[11u + 2u * ahAlpha() + i]; }
fn ahBSalt(t: u32) -> u32 { return nodeHash[11u + 3u * ahAlpha() + t]; }
fn ahCSalt1() -> u32 { return nodeHash[11u + 3u * ahAlpha() + ahBAttempts()]; }
fn ahCSalt2() -> u32 { return nodeHash[11u + 3u * ahAlpha() + ahBAttempts() + 1u]; }
// Probe the directory for key; returns the node index (nodeHashValues[slot])
// or INVALID if absent. Mirrors the JS FunnelTable.probe descent exactly.
fn adaptiveNodeProbe(key: u32) -> u32 {
    let alpha = ahAlpha();
    let beta = ahBeta();
    for (var i: u32 = 0u; i < alpha; i = i + 1u) {
        let aCount = ahSubarrayCount(i);
        let base = ahSlabOffset(i) + (ahashU32(key ^ ahSlabSalt(i)) % aCount) * beta;
        for (var s: u32 = 0u; s < beta; s = s + 1u) {
            let pos = base + s;
            let k = ahKeysAt(pos);
            if (k == key) { return ahValuesAt(pos); }
            if (k == AHASH_EMPTY) { return INVALID; }
        }
    }
    let bSize = ahBSize();
    let bOff = ahBOffset();
    let bAttempts = ahBAttempts();
    if (bSize > 0u) {
        for (var t: u32 = 0u; t < bAttempts; t = t + 1u) {
            let pos = bOff + (ahashU32(key ^ ahBSalt(t)) % bSize);
            let k = ahKeysAt(pos);
            if (k == key) { return ahValuesAt(pos); }
            if (k == AHASH_EMPTY) { return INVALID; }
        }
    }
    let cOff = ahCOffset();
    let cNumBuckets = ahCNumBuckets();
    let cBucketSlots = ahCBucketSlots();
    if (cNumBuckets > 0u) {
        let b1 = ahashU32(key ^ ahCSalt1()) % cNumBuckets;
        let b2 = ahashU32(key ^ ahCSalt2()) % cNumBuckets;
        for (var t: u32 = 0u; t < cBucketSlots; t = t + 1u) {
            let pa = cOff + b1 * cBucketSlots + t;
            let ka = ahKeysAt(pa);
            if (ka == key) { return ahValuesAt(pa); }
            if (ka == AHASH_EMPTY) { return INVALID; }
            let pb = cOff + b2 * cBucketSlots + t;
            let kb = ahKeysAt(pb);
            if (kb == key) { return ahValuesAt(pb); }
            if (kb == AHASH_EMPTY) { return INVALID; }
        }
    }
    return INVALID;
}
// Resolve the target leaf node for a particle position via the funnel
// directory. Derives the deepest-level cell from pos, packs the node key
// (level<<20 | iy<<10 | ix) -- matching the JS buildAdaptiveMetadata encoding
// -- and probes the directory. With the occupancy-adaptive quadtree the
// containing leaf may live at ANY level, so on a miss the cell is halved and
// the parent level re-probed.
//
// The deepest existing node on the chain CAN be internal: the builder only
// materializes NON-EMPTY children (exists requires counts > 0), so a split
// node may be missing exactly the child on the particle's chain. Between
// refreshes particles drift across refinement boundaries (inter-refresh mean
// displacement is many finest-leaf widths), and resolving to an internal
// node evaluates a node with NO List-1/List-3 (those are built for leaves
// only) and -- on the materialized-far path, where far_gather writes only
// terminal nodes -- locals holding just its P2L part: near-zero total force
// for up to a full refresh interval. Measured at 500k: the galaxy disperses
// (tree shrinks 22911 nodes at init to ~174 after 60 s) and the drift then
// keeps the refresh pinned at its minimum spacing. When the found node is
// internal, DESCEND toward the particle position through nodeChildren (slot
// layout matches the builder: bit0 = x-right, bit1 = y-up), falling back to
// the first existing child when the exact quadrant is an empty/absent one --
// a split node always has at least one non-empty child, so the descent
// terminates on a terminal node that geometrically contains (or directly
// borders) the particle.
// Returns the node index or INVALID if even the root probe misses (should
// not happen for a particle inside [0,1)^2; falls back to leafForParticle
// at the call site).
fn resolveLeafNode(pos: vec2<f32>) -> u32 {
    var lvl = params.levelCount - 1u;
    var ix = min(u32(clamp(pos.x, 0.0, 0.999999) * f32(1u << lvl)), (1u << lvl) - 1u);
    var iy = min(u32(clamp(pos.y, 0.0, 0.999999) * f32(1u << lvl)), (1u << lvl) - 1u);
    var n = INVALID;
    loop {
        let key = (lvl << 20u) | (iy << 10u) | ix;
        n = adaptiveNodeProbe(key);
        if (n != INVALID) { break; }
        if (lvl == 0u) { return INVALID; }
        lvl = lvl - 1u;
        ix = ix >> 1u;
        iy = iy >> 1u;
    }
    var node = n;
    for (var steps: u32 = 0u; steps < 12u; steps = steps + 1u) {
        if (isTerminal(node)) { return node; }
        let c = nodeChildren[node];
        let center = nodeCenterSize[node].xy;
        let slot = select(0u, 1u, pos.x >= center.x) + 2u * select(0u, 1u, pos.y >= center.y);
        var child = c[slot];
        if (child == INVALID) {
            child = INVALID;
            for (var s2: u32 = 0u; s2 < 4u; s2 = s2 + 1u) {
                if (c[s2] != INVALID) { child = c[s2]; break; }
            }
            if (child == INVALID) { return node; }
        }
        node = child;
    }
    return node;
}

@compute @workgroup_size(256)
fn clear(@builtin(global_invocation_id) id: vec3<u32>) {
    if (id.x >= params.nodeCount * 3u) { return; }
    multipoles[id.x] = vec4<f32>(0.0);
    locals[id.x] = vec4<f32>(0.0);
}

@compute @workgroup_size(64)
fn p2m(@builtin(global_invocation_id) id: vec3<u32>) {
    let node = id.x;
    if (node >= params.nodeCount) { return; }
    if (!isTerminal(node)) { return; }
    let range = nodeParticleRange[node];
    let center = nodeCenterSize[node].xy;
    var coeff = array<vec2<f32>, 5>(vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0), vec2<f32>(0.0));
    if (range.y > 0u) {
        // Bound the serial per-leaf loop: a saturated max-depth cell (all
        // particles collapsing onto the center of mass) can hold thousands
        // of particles, and this kernel runs one thread per leaf. Stride-
        // sample with a node-rotated offset and reweight by range.y/cnt so
        // the moments stay unbiased in expectation (same scheme as the
        // List-1 P2P budget below).
        let cnt = min(range.y, 512u);
        let skip = (node * 2654435761u) % range.y;
        let w = f32(range.y) / f32(cnt);
        for (var n = 0u; n < cnt; n = n + 1u) {
            let particle = particleIndices[range.x + ((skip + n) % range.y)];
            let dz = particles[particle].pos - center;
            var power = vec2<f32>(1.0, 0.0);
            coeff[0].x += charges[particle] * w;  // T-D7: use per-particle charge
            for (var k = 1u; k <= 4u; k = k + 1u) {
                power = cmul(power, dz);
                // P18-2: apply per-particle charge to higher-order multipole terms
                // (was missing after T-D7 only fixed k=0).
                if (k <= params.expansionOrder) { coeff[k] -= charges[particle] * w * power / f32(k); }
            }
        }
    }
    for (var k = 0u; k <= 4u; k = k + 1u) { writec(0u, node, k, coeff[k]); }
}

@compute @workgroup_size(64)
fn m2m(@builtin(global_invocation_id) id: vec3<u32>) {
    // Upward pass, dispatched per level: node = levelBase + id.x so the
    // workgroup range covers exactly this level's nodes.
    // dispatchCount guard: ceil(count/64) workgroups launch surplus threads
    // whose levelBase + id.x lands in the NEXT level's nodes. m2m is a pure
    // write so the double-run was only wasted work, but the same spill in
    // l2l/m2l doubles local expansions (correctness).
    if (id.x >= params.dispatchCount) { return; }
    let node = params.levelBase + id.x;
    if (node >= params.nodeCount) { return; }
    if (isTerminal(node)) { return; }
    let center = nodeCenterSize[node].xy;
    let children = nodeChildren[node];
    for (var k = 0u; k <= 4u; k = k + 1u) {
        var acc = vec2<f32>(0.0);
        for (var slot = 0u; slot < 4u; slot = slot + 1u) {
            let child = children[slot];
            if (child == INVALID) { continue; }
            let childCenter = nodeCenterSize[child].xy;
            if (k == 0u) {
                acc += readc(0u, child, 0u);
            } else {
                let delta = childCenter - center;
                var deltaPower = vec2<f32>(1.0, 0.0);
                for (var n = 0u; n < k; n = n + 1u) { deltaPower = cmul(deltaPower, delta); }
                let a0 = readc(0u, child, 0u);
                acc -= cmul(a0, deltaPower) / f32(k);
                for (var j = 1u; j <= k; j = j + 1u) {
                    var bj = 1.0;
                    for (var b = 1u; b <= (j - 1u); b = b + 1u) { bj *= f32(k - b) / f32(b); }
                    var dp = vec2<f32>(1.0, 0.0);
                    for (var n = 0u; n < (k - j); n = n + 1u) { dp = cmul(dp, delta); }
                    acc += cmul(readc(0u, child, j), dp) * bj;
                }
            }
        }
        writec(0u, node, k, acc);
    }
}

@compute @workgroup_size(64)
fn l2l(@builtin(global_invocation_id) id: vec3<u32>) {
    // Downward pass, dispatched per level with exact level ranges.
    // dispatchCount guard (see m2m): without it, surplus threads of the
    // ceil(count/64) dispatch spill into the next level's nodes and their
    // existing+acc double-accumulation doubles those locals.
    if (id.x >= params.dispatchCount) { return; }
    let node = params.levelBase + id.x;
    if (node >= params.nodeCount) { return; }
    let parent = nodeMeta[node].x;
    if (parent == INVALID) { return; }
    let center = nodeCenterSize[node].xy;
    let parentCenter = nodeCenterSize[parent].xy;
    let delta = center - parentCenter;
    for (var l = 0u; l <= 4u; l = l + 1u) {
        if (l > params.expansionOrder && l != 1u) { break; }
        var acc = vec2<f32>(0.0);
        for (var k = l; k <= 4u; k = k + 1u) {
            if (k > params.expansionOrder && k != 1u) { break; }
            var binom = 1.0;
            for (var b = 1u; b <= l; b = b + 1u) { binom *= f32(k - b + 1u) / f32(b); }
            var dp = vec2<f32>(1.0, 0.0);
            for (var n = 0u; n < (k - l); n = n + 1u) { dp = cmul(dp, delta); }
            acc += cmul(readc(1u, parent, k), dp) * binom;
        }
        let existing = readc(1u, node, l);
        writec(1u, node, l, existing + acc);
    }
}

@compute @workgroup_size(64)
fn m2l(@builtin(global_invocation_id) id: vec3<u32>) {
    // M2L, dispatched per level with exact level ranges. Each node is
    // processed exactly once per frame (locals were cleared by the clear
    // pass, and the dispatchCount guard below stops surplus ceil(count/64)
